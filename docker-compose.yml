# Base de données PostgreSQL locale de développement (projet Finance).
#
# Usage :
#   1. cp .env.example .env   (renseigner POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB)
#   2. docker compose up -d
#
# Le fichier .env racine est ignoré par Git (cf. .gitignore). Aucun secret
# n'est versionné. Les identifiants lus ici doivent correspondre à la variable
# DATABASE_URL utilisée par Prisma dans apps/api.
services:
  db:
    image: postgres:17-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_db_data:
